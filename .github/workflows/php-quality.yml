name: PHP quality checks

on:
  push:
    branches: [cybte-enterprise-refresh, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, fileinfo, mbstring, curl
          coverage: none
      - name: PHP syntax check for upgrade changes
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue
            case "$file" in
              *.php)
                if ! php -l "$file"; then failures=1; fi
                ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$failures" -eq 0
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|>>>>>>>)' --exclude-dir=.git --exclude-dir=vendor .; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi
      - name: Start PHP smoke server
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t public >/tmp/cybte-php-server.log 2>&1 &
          echo $! >/tmp/cybte-php-server.pid
          sleep 2
      - name: Public page smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for path in index.php login.php signup.php vault.php privacy.php terms.php security.php; do
            status=$(curl -sS -o /tmp/page.out -w '%{http_code}' "http://127.0.0.1:8080/$path")
            test "$status" = '200' || { echo "Smoke failure on $path"; cat /tmp/page.out; cat /tmp/cybte-php-server.log; exit 1; }
          done
      - name: Confirm security headers
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -sSI http://127.0.0.1:8080/index.php)
          echo "$headers" | grep -qi '^X-Content-Type-Options: nosniff'
          echo "$headers" | grep -qi '^X-Frame-Options: DENY'
      - name: Stop smoke server
        if: always()
        run: kill "$(cat /tmp/cybte-php-server.pid)" 2>/dev/null || true
