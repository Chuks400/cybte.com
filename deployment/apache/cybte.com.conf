# Apache Virtual Host Configuration for cybte.com
# Save this file to: /etc/apache2/sites-available/cybte.com.conf
# Then enable with: sudo a2ensite cybte.com.conf

# ============================================================================
# HTTP Virtual Host (Port 80) - Redirects to HTTPS
# ============================================================================
<VirtualHost *:80>
    ServerName cybte.com
    ServerAlias www.cybte.com
    ServerAdmin admin@cybte.com
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/cybte-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/cybte-redirect-access.log combined
</VirtualHost>

# ============================================================================
# HTTPS Virtual Host (Port 443) - Production Site
# ============================================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cybte.com
    ServerAlias www.cybte.com
    ServerAdmin admin@cybte.com
    
    # Document Root
    DocumentRoot /var/www/cybte.com/public
    
    # Directory Configuration
    <Directory /var/www/cybte.com/public>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
        
        # PHP Configuration
        <IfModule mod_php.c>
            php_admin_flag engine on
            php_admin_flag display_errors off
            php_admin_value upload_max_filesize 8M
            php_admin_value post_max_size 8M
            php_admin_value max_execution_time 30
            php_admin_value memory_limit 256M
        </IfModule>
    </Directory>
    
    # Deny access to sensitive files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    
    # Deny access to .env file
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>
    
    # Deny access to .git directory
    <DirectoryMatch "^/.+\.git/">
        Require all denied
    </DirectoryMatch>
    
    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cybte.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cybte.com/privkey.pem
    
    # Modern SSL Configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    SSLCompression off
    SSLUseStapling on
    SSLStaplingCache "shmcb:logs/ssl_stapling(32768)"
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    
    # Remove Server Header
    Header always unset X-Powered-By
    Header always unset Server
    
    # Logging Configuration
    ErrorLog ${APACHE_LOG_DIR}/cybte-error.log
    CustomLog ${APACHE_LOG_DIR}/cybte-access.log combined
    
    # Enable Gzip Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
        DeflateCompressionLevel 9
    </IfModule>
    
    # Browser Caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        ExpiresByType application/x-javascript "access plus 1 month"
        ExpiresByType text/html "access plus 1 hour"
        ExpiresByType application/xhtml+xml "access plus 1 hour"
    </IfModule>
    
    # PHP-FPM Configuration (if using PHP-FPM)
    <IfModule proxy_fcgi_module>
        <FilesMatch "\.(php|phar)$">
            SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </IfModule>
    
</VirtualHost>
</IfModule>

# ============================================================================
# ADDITIONAL SECURITY CONFIGURATION
# ============================================================================

# Disable Server Signature
ServerTokens Prod
ServerSignature Off

# Disable Trace Method
TraceEnable off

# ============================================================================
